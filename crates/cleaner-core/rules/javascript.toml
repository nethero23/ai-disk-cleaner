# JavaScript package managers and browser automation (MCP servers pull these in).

[[rule]]
id = "npm.cache"
tool = "npm"
category = "package_cache"
name_zh = "npm 缓存"
name_en = "npm cache"
paths = ["${LOCALAPPDATA}/npm-cache", "${USERPROFILE}/.npm/_cacache"]
safety = "safe"
consequence_zh = "npm 会在下次安装时重新下载"
consequence_en = "npm re-downloads on next install"

[[rule]]
id = "npx.cache"
tool = "npm"
category = "package_cache"
name_zh = "npx 临时包 (含 MCP 服务)"
name_en = "npx temporary packages (incl. MCP servers)"
paths = ["${LOCALAPPDATA}/npm-cache/_npx", "${USERPROFILE}/.npm/_npx"]
safety = "safe"
consequence_zh = "用 npx 启动的 MCP 服务下次启动时重新下载"
consequence_en = "MCP servers started with npx re-download on next start"

[[rule]]
id = "pnpm.store"
tool = "pnpm"
category = "package_cache"
name_zh = "pnpm 全局存储"
name_en = "pnpm store"
paths = ["${LOCALAPPDATA}/pnpm/store", "${LOCALAPPDATA}/pnpm-cache", "${USERPROFILE}/.local/share/pnpm/store"]
all_paths = true
safety = "safe"
consequence_zh = "相当于 pnpm store prune 后重新下载；已安装项目的硬链接仍有效"
consequence_en = "Like pnpm store prune then re-download; installed projects keep working"

[[rule]]
id = "yarn.cache"
tool = "Yarn"
category = "package_cache"
name_zh = "Yarn 缓存"
name_en = "Yarn cache"
paths = ["${LOCALAPPDATA}/Yarn/Cache", "${USERPROFILE}/.yarn/berry/cache", "${USERPROFILE}/.cache/yarn"]
all_paths = true
safety = "safe"
consequence_zh = "Yarn 会在下次安装时重新下载"
consequence_en = "Yarn re-downloads on next install"

[[rule]]
id = "bun.cache"
tool = "Bun"
category = "package_cache"
name_zh = "Bun 缓存"
name_en = "Bun cache"
paths = ["${USERPROFILE}/.bun/install/cache"]
safety = "safe"
consequence_zh = "Bun 会在下次安装时重新下载"
consequence_en = "Bun re-downloads on next install"

[[rule]]
id = "playwright.browsers"
tool = "Playwright"
category = "package_cache"
name_zh = "Playwright 浏览器"
name_en = "Playwright browsers"
paths = ["${PLAYWRIGHT_BROWSERS_PATH}", "${LOCALAPPDATA}/ms-playwright", "${USERPROFILE}/.cache/ms-playwright"]
safety = "redownload"
inspector = "versioned_children"
consequence_zh = "用到它的项目或 MCP 服务需要重新 playwright install（{size}）"
consequence_en = "Projects or MCP servers using it need playwright install again ({size})"

[[rule]]
id = "puppeteer.browsers"
tool = "Puppeteer"
category = "package_cache"
name_zh = "Puppeteer 浏览器"
name_en = "Puppeteer browsers"
paths = ["${USERPROFILE}/.cache/puppeteer"]
safety = "redownload"
inspector = "children"
consequence_zh = "Puppeteer 下次运行时重新下载 {size}"
consequence_en = "Puppeteer re-downloads {size} on next run"

[[rule]]
id = "electron.cache"
tool = "Electron"
category = "package_cache"
name_zh = "Electron 构建缓存"
name_en = "Electron build cache"
paths = ["${LOCALAPPDATA}/electron/Cache", "${LOCALAPPDATA}/electron-builder/Cache", "${USERPROFILE}/.cache/electron"]
all_paths = true
safety = "safe"
consequence_zh = "下次构建时重新下载"
consequence_en = "Re-downloaded on next build"
