# CLI coding agents. Transcripts are user data (Review); caches are safe.

[[rule]]
id = "claude_code.projects"
tool = "Claude Code"
category = "ai_agent"
name_zh = "Claude Code 会话记录"
name_en = "Claude Code session transcripts"
paths = ["${USERPROFILE}/.claude/projects"]
safety = "review"
inspector = "claude_projects"
consequence_zh = "该项目的对话历史会丢失，--resume 将找不到旧会话"
consequence_en = "That project's conversation history is lost; --resume won't find old sessions"
processes = ["claude"]

[[rule]]
id = "claude_code.cache"
tool = "Claude Code"
category = "ai_agent"
name_zh = "Claude Code 缓存与调试日志"
name_en = "Claude Code cache and debug logs"
paths = ["${USERPROFILE}/.claude/cache", "${USERPROFILE}/.claude/debug", "${USERPROFILE}/.claude/shell-snapshots", "${USERPROFILE}/.claude/statsig"]
all_paths = true
safety = "safe"
consequence_zh = "会自动重建"
consequence_en = "Rebuilds itself"

[[rule]]
id = "codex.sessions"
tool = "Codex CLI"
category = "ai_agent"
name_zh = "Codex 会话记录"
name_en = "Codex session logs"
paths = ["${USERPROFILE}/.codex/sessions"]
safety = "review"
consequence_zh = "Codex 的对话历史会丢失"
consequence_en = "Codex conversation history is lost"
processes = ["codex"]

[[rule]]
id = "codex.log"
tool = "Codex CLI"
category = "ai_agent"
name_zh = "Codex 日志"
name_en = "Codex logs"
paths = ["${USERPROFILE}/.codex/log"]
safety = "safe"
consequence_zh = "只是日志"
consequence_en = "Logs only"

[[rule]]
id = "gemini_cli.sessions"
tool = "Gemini CLI"
category = "ai_agent"
name_zh = "Gemini CLI 会话与检查点"
name_en = "Gemini CLI sessions and checkpoints"
paths = ["${USERPROFILE}/.gemini/tmp", "${USERPROFILE}/.gemini/sessions", "${USERPROFILE}/.gemini/checkpoints"]
all_paths = true
safety = "review"
consequence_zh = "Gemini CLI 的对话历史和未应用的修改会丢失"
consequence_en = "Gemini CLI chat history and staged edits are lost"

[[rule]]
id = "continue.index"
tool = "Continue"
category = "ai_agent"
name_zh = "Continue 代码索引"
name_en = "Continue code index"
paths = ["${USERPROFILE}/.continue/index"]
safety = "safe"
consequence_zh = "下次打开项目时重新建索引"
consequence_en = "Re-indexed next time the project is opened"

[[rule]]
id = "aider.cache"
tool = "Aider"
category = "ai_agent"
name_zh = "Aider 缓存"
name_en = "Aider cache"
paths = ["${USERPROFILE}/.aider/caches", "${USERPROFILE}/.aider.tags.cache.v3", "${USERPROFILE}/.aider.tags.cache.v4"]
all_paths = true
safety = "safe"
consequence_zh = "会自动重建"
consequence_en = "Rebuilds itself"

[[rule]]
id = "copilot_cli.cache"
tool = "GitHub Copilot"
category = "ai_agent"
name_zh = "Copilot CLI 缓存"
name_en = "Copilot CLI cache"
paths = ["${USERPROFILE}/.copilot/cache", "${LOCALAPPDATA}/github-copilot"]
all_paths = true
safety = "safe"
consequence_zh = "会自动重建"
consequence_en = "Rebuilds itself"

[[rule]]
id = "qwen_code.sessions"
tool = "Qwen Code"
category = "ai_agent"
name_zh = "Qwen Code 临时文件与会话"
name_en = "Qwen Code temp and sessions"
paths = ["${USERPROFILE}/.qwen/tmp", "${USERPROFILE}/.qwen/sessions", "${USERPROFILE}/.qwen/checkpoints"]
all_paths = true
safety = "review"
consequence_zh = "历史会话和检查点会丢失"
consequence_en = "Past sessions and checkpoints are lost"

[[rule]]
id = "opencode.data"
tool = "OpenCode"
category = "ai_agent"
name_zh = "OpenCode 日志与缓存"
name_en = "OpenCode logs and cache"
paths = ["${USERPROFILE}/.local/share/opencode/log", "${USERPROFILE}/.cache/opencode"]
all_paths = true
safety = "safe"
consequence_zh = "日志和缓存，会自动重建"
consequence_en = "Logs and cache; rebuilt automatically"

[[rule]]
id = "cline.tasks"
tool = "Cline"
category = "ai_agent"
name_zh = "Cline 任务历史"
name_en = "Cline task history"
paths = ["${APPDATA}/Code/User/globalStorage/saoudrizwan.claude-dev/tasks", "${APPDATA}/Cursor/User/globalStorage/saoudrizwan.claude-dev/tasks"]
all_paths = true
safety = "review"
inspector = "children"
consequence_zh = "每个任务的对话记录和文件快照会丢失"
consequence_en = "Each task's conversation and file snapshots are lost"

[[rule]]
id = "roo_code.tasks"
tool = "Roo Code"
category = "ai_agent"
name_zh = "Roo Code 任务历史"
name_en = "Roo Code task history"
paths = ["${APPDATA}/Code/User/globalStorage/rooveterinaryinc.roo-cline/tasks", "${APPDATA}/Cursor/User/globalStorage/rooveterinaryinc.roo-cline/tasks"]
all_paths = true
safety = "review"
inspector = "children"
consequence_zh = "每个任务的对话记录和文件快照会丢失"
consequence_en = "Each task's conversation and file snapshots are lost"

[[rule]]
id = "claude_code.file_history"
tool = "Claude Code"
category = "ai_agent"
name_zh = "Claude Code 文件快照 (file-history)"
name_en = "Claude Code file snapshots (file-history)"
paths = ["${USERPROFILE}/.claude/file-history"]
safety = "review"
min_bytes = 52428800
consequence_zh = "用于 /rewind 回退改动；删除后旧会话无法回退，当前会话不受影响"
consequence_en = "Backs /rewind; old sessions can no longer be rewound, the current one is unaffected"

[[rule]]
id = "codex.archived_sessions"
tool = "Codex"
category = "ai_agent"
name_zh = "Codex 归档会话"
name_en = "Codex archived sessions"
paths = ["${USERPROFILE}/.codex/archived_sessions"]
safety = "review"
consequence_zh = "已归档的对话记录会丢失"
consequence_en = "Archived conversations are lost"

[[rule]]
id = "kilo_code.tasks"
tool = "Kilo Code"
category = "ai_agent"
name_zh = "Kilo Code 任务历史"
name_en = "Kilo Code task history"
paths = ["${APPDATA}/Code/User/globalStorage/kilocode.kilo-code/tasks", "${APPDATA}/Cursor/User/globalStorage/kilocode.kilo-code/tasks"]
all_paths = true
safety = "review"
inspector = "children"
consequence_zh = "每个任务的对话记录和文件快照会丢失"
consequence_en = "Each task's conversation and file snapshots are lost"

[[rule]]
id = "goose.sessions"
tool = "Goose"
category = "ai_agent"
name_zh = "Goose 会话与日志"
name_en = "Goose sessions and logs"
paths = ["${APPDATA}/Block/goose/data/sessions", "${APPDATA}/Block/goose/data/logs", "${USERPROFILE}/.local/share/goose/sessions", "${USERPROFILE}/.local/state/goose/logs"]
all_paths = true
safety = "review"
consequence_zh = "历史会话会丢失"
consequence_en = "Past sessions are lost"
