processes = ["msedge"]


[[rule]]
id = "comfyui.models"
tool = "ComfyUI"
category = "models"
name_zh = "ComfyUI 模型 (checkpoints / loras / vae)"
name_en = "ComfyUI models"
paths = ["${USERPROFILE}/Documents/ComfyUI/models", "${USERPROFILE}/ComfyUI/models"]
safety = "review"
inspector = "children"
consequence_zh = "多为手动下载的模型，删除后需要自己重新下载 {size}"
consequence_en = "Mostly hand-downloaded; you re-download {size} yourself"
processes = ["ComfyUI", "python"]

