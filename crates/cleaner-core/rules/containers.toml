# Docker Desktop and WSL. Reported, not deleted: the right fix is compacting the
# virtual disk, which arrives in v0.2.

[[rule]]
id = "docker.vhdx"
tool = "Docker Desktop"
category = "container"
name_zh = "Docker Desktop 虚拟磁盘"
name_en = "Docker Desktop virtual disk"
paths = ["${LOCALAPPDATA}/Docker/wsl", "${LOCALAPPDATA}/Docker/wsl/data"]
safety = "review"
consequence_zh = "所有镜像、容器和卷都会丢失。更好的做法是 docker system prune 后压缩虚拟磁盘"
consequence_en = "All images, containers and volumes are lost. Better: docker system prune, then compact the disk"
windows_only = true
processes = ["Docker Desktop", "com.docker.backend"]

[[rule]]
id = "wsl.distros"
tool = "WSL"
category = "container"
name_zh = "WSL 发行版虚拟磁盘"
name_en = "WSL distribution virtual disks"
# Store installs keep the disk in their package folder; newer `wsl --install`
# puts it in %LOCALAPPDATA%\wsl\{guid}.
paths = ["${LOCALAPPDATA}/Packages", "${LOCALAPPDATA}/wsl"]
all_paths = true
safety = "review"
inspector = "children"
require = ["LocalState/ext4.vhdx", "ext4.vhdx"]
min_bytes = 2147483648
consequence_zh = "这是整个 Linux 子系统。删除即丢失其中全部文件"
consequence_en = "This is a whole Linux system; deleting loses everything inside it"
windows_only = true
processes = ["wsl", "vmmem", "vmmemWSL"]

[[rule]]
id = "docker.cli_cache"
tool = "Docker"
category = "container"
name_zh = "Docker CLI 缓存"
name_en = "Docker CLI cache"
paths = ["${USERPROFILE}/.docker/cache", "${LOCALAPPDATA}/Docker/log"]
all_paths = true
safety = "safe"
consequence_zh = "日志与缓存，会自动重建"
consequence_en = "Logs and cache; rebuilds itself"
