consequence_en = "Embedding and audio caches; rebuilt on demand"

[[rule]]
id = "gradio.cache"
tool = "Gradio"
category = "ai_desktop_app"
name_zh = "Gradio 上传/输出缓存"
name_en = "Gradio upload and output cache"
paths = ["${GRADIO_TEMP_DIR}", "${USERPROFILE}/.cache/gradio", "${TEMP}/gradio"]
all_paths = true
safety = "safe"
consequence_zh = "SD WebUI 等 Gradio 界面的上传图片和生成结果副本"
consequence_en = "Copies of uploads and outputs from Gradio UIs such as SD WebUI"

[[rule]]
id = "sd_webui.temp"
tool = "Stable Diffusion WebUI"
category = "ai_desktop_app"
name_zh = "Stable Diffusion WebUI 临时文件"
name_en = "Stable Diffusion WebUI temp"
paths = ["${USERPROFILE}/stable-diffusion-webui/tmp", "${USERPROFILE}/stable-diffusion-webui/log", "${USERPROFILE}/sd.webui/webui/tmp"]
all_paths = true
safety = "safe"
consequence_zh = "临时图片和日志，不影响生成"
consequence_en = "Temp images and logs; generation is unaffected"

[[rule]]
id = "claude_desktop.extensions_stale"
tool = "Claude"
category = "ai_desktop_app"
name_zh = "Claude 桌面版扩展旧版本"
name_en = "Claude Desktop extension old versions"
paths = ["${APPDATA}/Claude/Claude Extensions"]
safety = "safe"
inspector = "stale_versions"
consequence_zh = "只删旧版本文件夹，当前版本保留"
consequence_en = "Only old version folders go; the current version stays"
processes = ["Claude"]
