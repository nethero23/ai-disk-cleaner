[[rule]]
id = "antigravity.cache"
tool = "Antigravity"
category = "ai_editor"
name_zh = "Antigravity 缓存"
name_en = "Antigravity cache"
paths = ["${APPDATA}/Antigravity/Cache", "${APPDATA}/Antigravity/CachedData", "${APPDATA}/Antigravity/Code Cache", "${APPDATA}/Antigravity/GPUCache", "${APPDATA}/Antigravity/logs"]
