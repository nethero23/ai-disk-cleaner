# VS Code-family AI editors. Cache folders are safe; globalStorage holds the chat DB.

[[rule]]
id = "cursor.cache"
tool = "Cursor"
category = "ai_editor"
name_zh = "Cursor 缓存"
name_en = "Cursor cache"
paths = ["${APPDATA}/Cursor/Cache", "${APPDATA}/Cursor/CachedData", "${APPDATA}/Cursor/Code Cache", "${APPDATA}/Cursor/GPUCache", "${APPDATA}/Cursor/CachedExtensionVSIXs"]
all_paths = true
safety = "safe"
consequence_zh = "Cursor 会自动重建"
consequence_en = "Cursor rebuilds it"

[[rule]]
id = "cursor.logs"
tool = "Cursor"
category = "ai_editor"
name_zh = "Cursor 日志"
name_en = "Cursor logs"
paths = ["${APPDATA}/Cursor/logs"]
safety = "safe"
consequence_zh = "只是日志"
consequence_en = "Logs only"

[[rule]]
id = "cursor.workspaces"
tool = "Cursor"
category = "ai_editor"
name_zh = "Cursor 工作区存储"
name_en = "Cursor workspace storage"
paths = ["${APPDATA}/Cursor/User/workspaceStorage"]
safety = "review"
inspector = "cursor_workspaces"
consequence_zh = "该项目在 Cursor 里的状态和对话记录会丢失"
consequence_en = "That project's editor state and chat history in Cursor is lost"

[[rule]]
id = "cursor.global_state"
tool = "Cursor"
category = "ai_editor"
name_zh = "Cursor 全局状态库 (state.vscdb，含全部对话)"
name_en = "Cursor global state DB (state.vscdb, all chats)"
paths = ["${APPDATA}/Cursor/User/globalStorage"]
safety = "review"
min_bytes = 1073741824
consequence_zh = "所有 Cursor 对话和设置会丢失。建议先在 Cursor 里导出或清理旧对话，而不是整个删除"
consequence_en = "All Cursor chats and settings are lost. Export or prune old chats inside Cursor instead of deleting this"

