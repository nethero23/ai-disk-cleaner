all_paths = true
safety = "safe"
consequence_zh = "VS Code 会自动重建"
consequence_en = "VS Code rebuilds it"

[[rule]]
id = "vscode.workspaces"
tool = "VS Code"
category = "ai_editor"
name_zh = "VS Code 工作区存储"
name_en = "VS Code workspace storage"
paths = ["${APPDATA}/Code/User/workspaceStorage"]
safety = "review"
