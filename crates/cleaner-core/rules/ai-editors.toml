safety = "safe"
consequence_zh = "Windsurf 会自动重建"
consequence_en = "Windsurf rebuilds it"

[[rule]]
id = "windsurf.workspaces"
tool = "Windsurf"
category = "ai_editor"
name_zh = "Windsurf 工作区存储"
name_en = "Windsurf workspace storage"
paths = ["${APPDATA}/Windsurf/User/workspaceStorage"]
safety = "review"
inspector = "cursor_workspaces"
consequence_zh = "该项目在 Windsurf 里的状态和对话记录会丢失"
consequence_en = "That project's editor state and chat history in Windsurf is lost"

