[[rule]]
id = "jetbrains.caches"
tool = "JetBrains"
category = "ai_editor"
name_zh = "JetBrains IDE 索引缓存"
name_en = "JetBrains IDE index caches"
paths = ["${LOCALAPPDATA}/JetBrains"]
safety = "safe"
inspector = "children"
min_bytes = 104857600
consequence_zh = "IDE 下次打开项目时重新建索引，会慢几分钟"
consequence_en = "The IDE re-indexes on next open, which takes a few minutes"
processes = ["idea64", "pycharm64", "webstorm64", "clion64", "goland64", "rider64", "rustrover64"]


