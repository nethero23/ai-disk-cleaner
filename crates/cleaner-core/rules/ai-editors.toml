paths = ["${APPDATA}/Windsurf/Cache", "${APPDATA}/Windsurf/CachedData", "${APPDATA}/Windsurf/Code Cache", "${APPDATA}/Windsurf/GPUCache", "${APPDATA}/Windsurf/logs"]
