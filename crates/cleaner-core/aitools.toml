# Where each AI tool keeps its MCP servers, skills, plugins and extensions.
# Paths use the same ${VAR} templates as the cleaning rules. `verified = false`
# marks a path taken from docs or community guides that has not been seen on a
# real machine yet; the inventory still probes it, nothing else changes.
#
# mcp.root: the key under which the servers live ("mcpServers", "servers",
# "mcp", "context_servers", "mcp_servers"). mcp.format: "json" (JSON, comments
# and trailing commas tolerated) or "toml".

[[tool]]
id = "claude_code"
name = "Claude Code"
processes = ["claude"]
skills = ["${USERPROFILE}/.claude/skills"]
plugins = "${USERPROFILE}/.claude/plugins"
[[tool.mcp]]
path = "${USERPROFILE}/.claude.json"
root = "mcpServers"
projects = true

[[tool]]
id = "claude_desktop"
name = "Claude Desktop"
processes = ["claude"]
extensions = ["${APPDATA}/Claude/Claude Extensions"]
[[tool.mcp]]
path = "${APPDATA}/Claude/claude_desktop_config.json"
root = "mcpServers"

