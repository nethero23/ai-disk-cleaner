name: CI

on:
  push:
    # A push to release/vX.Y.Z builds the installer and publishes the
    # vX.Y.Z release, for environments that cannot push tags or dispatch
    # workflows. Tags and the manual run below do the same.
    branches: [main, "release/v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  core:
    name: Core engine (tests, clippy)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p cleaner-core --all-targets -- -D warnings
      - run: cargo test -p cleaner-core

  app:
    name: Tauri app (Windows build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run build
      - run: cargo build -p ai-disk-cleaner
      - name: Resolve release tag
        shell: bash
        run: |
          tag=""
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/*) tag="${GITHUB_REF_NAME#release/}" ;;
          esac
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Bundle installer (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures, so the in-app updater will not offer this release."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Updater manifest (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        run: python3 .github/latest_json.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" target/release/bundle/nsis target/release/bundle/latest.json
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: GitHub release (releases only)
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/latest.json
