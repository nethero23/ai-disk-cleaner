name: CI

on:
  push:
    # A push to release/vX.Y.Z builds the installer and publishes the
    # vX.Y.Z release, for environments that cannot push tags or dispatch
    # workflows. Tags and the manual run below do the same.
    branches: [main, "release/v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  core:
    name: Core engine (tests, clippy)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p cleaner-core --all-targets -- -D warnings
      - run: cargo test -p cleaner-core

  app:
    name: Tauri app (Windows build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run build
      - run: cargo build -p ai-disk-cleaner
      - name: Resolve release tag
        shell: bash
        run: |
          tag=""
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/*) tag="${GITHUB_REF_NAME#release/}" ;;
          esac
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Bundle installer (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update signatures, so the in-app updater will not offer this release."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Updater manifest (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        run: python3 .github/latest_json.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" target/release/bundle/nsis target/release/bundle/latest.json
      - name: Portable zip (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -e
          ver="${RELEASE_TAG#v}"
          exe="target/release/AI Disk Cleaner.exe"
          [ -f "$exe" ] || exe="target/release/ai-disk-cleaner.exe"
          rm -rf portable && mkdir -p portable/data
          cp "$exe" "portable/AI Disk Cleaner.exe"
          : > portable/portable
          printf 'AI Disk Cleaner %s (portable)\n\nRun "AI Disk Cleaner.exe". Settings, logs and the browser profile stay in the "data" folder next to it.\nOnly one copy runs at a time: starting the portable build while the installed app is open (or the other way round) just brings the open window to the front.\nNeeds the WebView2 runtime, which Windows 10/11 already have.\nThe portable build does not auto-update: download a newer zip from\nhttps://github.com/%s/releases\n\n便携版：双击 "AI Disk Cleaner.exe" 即可，设置、日志和浏览器数据都放在旁边的 data 文件夹里。\n同一时间只能开一个：已装版开着时再开便携版（或反过来），只会把已开的窗口带到前面。\n便携版不会自动更新，新版本请到上面的地址下载。\n' "$ver" "$GITHUB_REPOSITORY" > portable/README.txt
          zip="target/release/bundle/AI.Disk.Cleaner_${ver}_x64-portable.zip"
          (cd portable && 7z a -tzip "../$zip" . > /dev/null)
          ls -l "$zip"
      - name: winget and Scoop manifests (releases only)
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -e
          ver="${RELEASE_TAG#v}"
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          python3 .github/manifests.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$setup" "target/release/bundle/AI.Disk.Cleaner_${ver}_x64-portable.zip" target/release/bundle/manifests
          (cd target/release/bundle/manifests && 7z a -tzip "../AI.Disk.Cleaner_${ver}_manifests.zip" . > /dev/null)
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/*.zip
      - name: GitHub release (releases only)
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/latest.json
            target/release/bundle/*.zip
